[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econophysics-ml"
version = "0.2.0"
description = "Econophysics, machine learning and market-risk models for financial time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francisco Nahuel Quintanilla", email = "quinta833@gmail.com" }]
keywords = [
    "econophysics",
    "value-at-risk",
    "market-risk",
    "backtesting",
    "basel",
    "machine-learning",
    "quantitative-finance",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "yfinance>=0.2",
    "requests>=2.28",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
live = ["schedule>=1.2"]
boost = ["xgboost>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

# Solo `varengine/` es un paquete importable; el resto son scripts sueltos
# que se corren desde la raíz del repo.
[tool.setuptools]
packages = ["varengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py310"
